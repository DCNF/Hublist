<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="The DCNF Hublist – Public hublist for ADC, DCHUB and NMDC clients">
    <meta name="keywords" content="dcnf,hublist,dchub,adc,nmdc">
    <link rel="icon" href="favicon.ico">

    <title>The DCNF Hublist</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="container" aria-label="Main">
        <ul>
            <li><strong>The DCNF Hublist</strong></li>
        </ul>
        <ul>
            <li><a href="https://github.com/DCNF/Hublist/issues/new?template=hub-submission.yml" class="contrast">Add hub</a></li>
        </ul>
    </nav>

    <main class="container">
        <header>
            <h1>The DCNF Hublist</h1>
            <p>Browse ADC, DCHUB and NMDC hubs.</p>
            <p>Add one of these URLs to your DC client's public hub list:</p>
            <div class="hublist-urls">
                <p class="hublist-url">
                    <code>https://dcnf.github.io/Hublist/hublist.xml</code>
                    <button class="outline copy-btn" onclick="copyText(this, 'https://dcnf.github.io/Hublist/hublist.xml')" aria-label="Copy XML URL">Copy</button>
                </p>
                <p class="hublist-url">
                    <code>https://dcnf.github.io/Hublist/hublist.xml.bz2</code>
                    <button class="outline copy-btn" onclick="copyText(this, 'https://dcnf.github.io/Hublist/hublist.xml.bz2')" aria-label="Copy BZ2 URL">Copy</button>
                </p>
            </div>
        </header>

        <section id="hubSection">
            <div class="search-bar">
                <input type="search" id="searchInput" placeholder="Search hubs..." aria-label="Search hubs">
                <span id="hubCount" class="hub-count"></span>
            </div>

            <div class="overflow-auto">
                <table class="striped" id="hubTable">
                    <thead>
                        <tr>
                            <th scope="col" data-sort="name" class="sortable">Name</th>
                            <th scope="col" data-sort="shared" class="sortable">Shared</th>
                            <th scope="col" data-sort="users" class="sortable">Users</th>
                        </tr>
                    </thead>
                    <tbody id="hubTableBody"></tbody>
                </table>
            </div>

            <div id="loading" class="loading" aria-busy="true">Loading hubs...</div>
            <div id="error" class="error" hidden></div>

            <nav id="pagination" class="pagination" aria-label="Pagination" hidden>
                <button id="prevPage" class="outline" aria-label="Previous page">&laquo; Prev</button>
                <span id="pageInfo"></span>
                <button id="nextPage" class="outline" aria-label="Next page">Next &raquo;</button>
            </nav>
        </section>
    </main>

    <dialog id="hubModal">
        <article>
            <header>
                <button aria-label="Close" rel="prev" onclick="closeModal()"></button>
                <p id="modalTitle"></p>
            </header>
            <div id="modalBody"></div>
        </article>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
